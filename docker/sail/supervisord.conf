[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan horizon --no-interaction
user=sail
environment=LARAVEL_SAIL="1"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Agendamento em desenvolvimento: use o serviço Docker Compose `scheduler-work` (schedule:work).
; Mantido desligado aqui para não duplicar tarefas com esse container.
[program:laravel-scheduler]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan schedule:work --no-interaction
user=sail
environment=LARAVEL_SAIL="1"
directory=/var/www/html
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pulse-work]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan pulse:work --no-interaction
user=sail
environment=LARAVEL_SAIL="1"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pulse-check]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan pulse:check --no-interaction
user=sail
environment=LARAVEL_SAIL="1"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nightwatch-agent]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan nightwatch:agent --no-interaction
user=sail
environment=LARAVEL_SAIL="1"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
